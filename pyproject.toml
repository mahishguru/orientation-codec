[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orientation-codec"
version = "1.0.0"
description = "HCP-aware crystallographic orientation codec: DREAM.3D orientation fields <-> smooth RGB images for neural networks"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mahish K. Guru" }]
keywords = [
    "crystallography", "EBSD", "texture", "DREAM.3D", "DAMASK",
    "magnesium", "HCP", "quaternion", "generative models",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "h5py>=3.8",
    "tifffile>=2023.1",
    "Pillow>=10.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
orientation-codec = "orientation_codec.cli:main"

[project.urls]
Repository = "https://github.com/mahishguru/orientation-codec"

[tool.setuptools.packages.find]
include = ["orientation_codec*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
